<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A modern single-page conversion of the original KidsTown website."
  >
  <title>KidsTown</title>
  <link rel="stylesheet" href="styles.css">
  <script src="citypark.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <a class="site-title" href="#/home">KidsTown</a>
    <span>SPA Conversion</span>
  </header>

  <main>
    <section id="home-view" class="home-view">
      <h1>Welcome to KidsTown</h1>

      <p class="instructions">
        Click a location on the original KidsTown map to explore.
      </p>

      <div class="map-container">
        <img
          src="assets/images/hometown.gif"
          alt="Map of KidsTown"
          width="310"
          height="318"
          usemap="#home-map"
        >

        <map name="home-map">
          <area
            shape="poly"
            coords="10,37,27,37,38,20,53,16,54,6,71,1,74,18,85,20,88,33,106,34,105,49,94,64,33,71,17,45,7,42,10,37"
            href="#/township"
            alt="Visit the Township"
          >

          <area
            shape="poly"
            coords="91,101,111,106,136,96,143,89,157,89,176,94,191,75,194,65,204,60,211,67,204,71,200,71,192,96,189,108,188,137,127,137,126,115,109,116,91,102"
            href="#/museum"
            alt="Visit the Museum"
          >

          <area
            shape="poly"
            coords="168,2,216,22,236,11,241,2,260,1,260,19,241,24,242,36,284,29,308,15,308,46,292,60,231,70,193,55,166,32,161,19,162,2"
            href="#/zoo"
            alt="Visit the Zoo"
          >

          <area
            shape="poly"
            coords="237,287,238,272,239,265,239,246,233,239,257,214,257,196,263,186,267,180,270,169,285,171,282,182,271,179,273,185,279,194,281,206,285,206,305,235,301,240,300,263,279,288,242,287"
            href="#/school"
            alt="Visit the School"
          >

          <area
            shape="poly"
            coords="226,145,239,132,240,109,234,99,260,95,268,87,270,70,290,72,288,87,273,84,285,93,289,101,309,118,307,124,307,161,251,173,226,144"
            href="#/city-hall"
            alt="Visit City Hall"
          >

          <area
            shape="poly"
            coords="7,195,8,151,35,143,36,132,86,130,86,143,90,144,91,194,62,201,35,202,7,195"
            href="#/toy-store"
            alt="Visit the Toy Store"
          >

          <area
            shape="poly"
            coords="7,307,4,222,35,216,61,227,63,287,10,310,7,307"
            href="#/city-park"
            alt="Visit City Park"
          >

          <area
            shape="poly"
            coords="97,301,102,241,143,217,169,227,167,280,131,309,113,312,97,301"
            href="#/library"
            alt="Visit the Library"
          >
        </map>
      </div>

      <p class="welcome-message">
        Discover KidsTown by visiting the park, museum, zoo, school,
        library, toy store, city hall, and township.
      </p>
    </section>

    <section id="location-view" class="location-view" hidden>
      <h1 id="location-title"></h1>
      <p id="location-message"></p>
      <a class="home-button" href="#/home">Return to the KidsTown map</a>
    </section>

    <section id="citypark-view" class="citypark-view" hidden>
      <div id="citypark-content"></div>
    </section>
  </main>

  <footer>
    <p>KidsTown CGI-to-SPA Conversion</p>
  </footer>
</body>
</html>
